name: Nightly stability

# Heavy, long-running stability jobs that are too slow for the per-PR gate:
# deep randomized stress, the full suite under ThreadSanitizer, long fuzz
# runs with an accreting corpus, and a server soak that watches for leaks
# across kill/restart cycles.  Runs on the dev branch overnight and on
# manual dispatch.  Failures upload artifacts for triage.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  stress-random:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev }
      - name: Build (debug + ASan)
        run: make debug
      - name: Build test binary
        run: make test-full-bin   # ASan rayforce.test; run below with knobs
      - name: Deep randomized stress
        run: |
          # 10 date-derived seeds, 50k ops each, printed for reproduction.
          for s in $(seq 1 10); do
            echo "::group::stress seed $s"
            RAYFORCE_CORES=4 RAY_STRESS_SEED=$s RAY_STRESS_ITERS=50000 \
              ./rayforce.test -f stress || exit 1
            echo "::endgroup::"
          done

  tsan-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev }
      # The release binary as it ships: the pinned Clang and the portable
      # baseline of the distributable (release.yml).
      - name: Install the current Clang
        uses: ./.github/actions/setup-clang-current
      - name: Build server binary (IPC tests spawn ./rayforce)
        run: make release CC="$CLANG_CURRENT" RAY_MARCH=x86-64-v3
      - name: Full suite under ThreadSanitizer
        run: |
          # Empty filter = the whole in-process suite; 4 cores for contention.
          # ./rayforce (release) is the server the IPC-diff tests spawn.
          make tsan-test TSAN_CORES=4 TSAN_FILTER=""

  fuzz-long:
    runs-on: ubuntu-latest
    env:
      # Keep clang fuzz builds off hosted-runner native ISA quirks.
      RAY_MARCH: x86-64
    strategy:
      fail-fast: false
      matrix:
        target: [parse, numparse, de, eval, csv, journal, select_merge]
        include:
          - target: select_merge
            cores: 4
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev }
      - name: Cache fuzz corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed corpora
        run: |
          make debug
          scripts/fuzz-seed-parse.sh || true
          scripts/fuzz-seed-frames.sh || true
      - name: Fuzz ${{ matrix.target }} (15 min)
        env:
          RAY_FUZZ_CORES: ${{ matrix.cores || 0 }}
        run: make fuzz-${{ matrix.target }} FUZZ_RUNTIME=900
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*
          if-no-files-found: ignore

  keyless-agg-instructions:
    # The keyless aggregates of a plain column run a typed loop per column
    # type (#1628); a per-row type dispatch or the generic per-row path
    # coming back costs 10 to 140 times the instructions.  Counted by
    # callgrind, so the bound does not depend on the runner's load.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev }
      - name: Install gcc 12 and valgrind
        run: sudo apt-get update && sudo apt-get install -y gcc-12 valgrind
      - name: Instruction-count bounds (gcc 12 release)
        run: make bench-keyless-agg CC=gcc-12

  soak-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev }
      # The release binary as it ships: the pinned Clang and the portable
      # baseline of the distributable (release.yml).
      - name: Install the current Clang
        uses: ./.github/actions/setup-clang-current
      - name: Build (release — realistic RSS)
        run: make release CC="$CLANG_CURRENT" RAY_MARCH=x86-64-v3
      - name: Server soak (45 min, kill/restart, RSS-slope leak watch)
        run: SOAK_SECONDS=2700 SOAK_CLIENTS=4 bash scripts/soak.sh
      - name: Upload RSS trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-rss
          path: /tmp/rf_soak_*_rss.csv
          if-no-files-found: ignore

  # The suite with every assert() compiled out, and the macOS release build:
  # out of the merge queue for its pace (ci.yml), so dev gets them here every
  # night as well as on each release PR into master.
  ndebug:
    runs-on: ubuntu-latest
    env:
      RAY_MARCH: x86-64
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev }
      - name: Install a comma-decimal locale
        run: sudo locale-gen de_DE.UTF-8
      - name: Test with NDEBUG
        run: make -j4 test-ndebug

  macos-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev }
      - name: Build (release)
        run: make -j4 release CC=clang
      - name: Build shared library and run an example against it
        run: |
          make -j4 shared CC=clang
          clang -O2 -Iinclude -Isrc examples/analytics.c -L. -lrayforce -lm -lpthread -Wl,-rpath,"$PWD" -o analytics-shared
          ./analytics-shared
