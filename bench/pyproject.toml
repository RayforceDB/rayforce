[project]
name = "rayforce-bench"
version = "0.1.0"
description = "Vendor-neutral benchmarking framework for RayforceDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "duckdb>=0.10.0",
    "polars>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
run-bench = "run_bench:main"
