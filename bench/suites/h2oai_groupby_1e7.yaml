# H2OAI db-benchmark Group By Suite
#
# Standard 10M row benchmark (G1_1e7_1e2_0_0)
# https://h2oai.github.io/db-benchmark/

name: h2oai_groupby_1e7
description: H2OAI db-benchmark Group By (10M rows, K=100)
version: "1.0.0"

dataset: G1_1e7_1e2_0_0

warmup: 1
iterations: 3
cache_mode: warm

tasks:
  - id: groupby_q1
    description: "Q1: sum(v1) by id1 (low cardinality)"

  - id: groupby_q2
    description: "Q2: sum(v1) by id1, id2 (low cardinality pair)"

  - id: groupby_q3
    description: "Q3: sum(v1), mean(v3) by id3 (high cardinality)"

  - id: groupby_q4
    description: "Q4: mean(v1), mean(v2), mean(v3) by id4 (low cardinality)"

  - id: groupby_q5
    description: "Q5: sum(v1), sum(v2), sum(v3) by id6 (high cardinality)"

  - id: groupby_q6
    description: "Q6: max(v1) - min(v2) by id3 (high cardinality, expr)"

  - id: groupby_q7
    description: "Q7: sum(v3), count by id1-id6 (wide group by)"

  - id: groupby_q8
    description: "Q8: filter(v1>=3) then sum(v3) by id2 (range filter)"

  - id: groupby_q9
    description: "Q9: filter(v1>=2 AND v2<=8) then sum(v1,v2,v3) by id3"

  - id: groupby_q10
    description: "Q10: filter(v3>0) then sum(v1), sum(v2) by id1-id4"
